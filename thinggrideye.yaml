# esp32thingplus test platform
# testbed for stuff like the AMG8833 8x8 IR thermal sensor

esphome:
  name: thinggrideye
  # AMG8833 includes/libraries removed: the `custom` sensor platform they
  # relied on no longer exists upstream (see the disabled sensor/text_sensor
  # blocks below), and with no active sensor: entries left the raw headers
  # no longer compile (Sensor type isn't pulled in). Needs an external_component
  # rewrite to bring the AMG8833 testbed back.

esp32:
  board: esp32thing_plus
  framework:
    type: arduino

i2c:
  scan: true
  # labeled as SDA/SCL but also on the Qwiic connector
  sda: GPIO23
  scl: GPIO22

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  fast_connect: True
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

mqtt:
  broker: '192.168.178.127'
  username: !secret mqtt_username
  password: !secret mqtt_password

