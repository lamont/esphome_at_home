# esp32thingplus test platform
# testbed for stuff like the AMG8833 8x8 IR thermal sensor

esphome:
  name: thinggrideye

esp32:
  board: esp32thing_plus
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components

i2c:
  scan: true
  # labeled as SDA/SCL but also on the Qwiic connector
  sda: GPIO23
  scl: GPIO22

amg8833:
  update_interval: 1s

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  fast_connect: True
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

mqtt:
  broker: '192.168.178.127'
  username: !secret mqtt_username
  password: !secret mqtt_password

text_sensor:
  - platform: amg8833
    pixels:
      name: "Sensor Pixels"

sensor:
  - platform: amg8833
    temperature:
      name: "Thermal Sensor Temperature"
    max_temperature:
      name: "Thermal Sensor Max"
    min_temperature:
      name: "Thermal Sensor Min"
    avg_temperature:
      name: "Thermal Sensor Avg"
    min_pixel_index:
      name: "Thermal Sensor Min Index"
    max_pixel_index:
      name: "Thermal Sensor Max Index"

