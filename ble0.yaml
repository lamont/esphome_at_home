# Olimex PoE esp32 (isolated)
# can it ble while running a wired ip stack?

external_components:
  - source: github://bendikwa/esphome-igrill@v1.2

# Enable Home Assistant API
api:

# enabling the ble disables the wifi, not enough memory maybe
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

igrill_ble_listener:

# This enables the home assistant bluetooth proxy through this device
bluetooth_proxy:
  active: true

text_sensor:
  - platform: ble_scanner
    name: "Sunroom ble0 BLE Devices Scanner"

esphome:
  name: ble0

esp32:
  board: esp32-poe
  framework:
    type: arduino

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0
  power_pin: GPIO12
  domain: .henry.st

# Enable logging
logger:
  # very_verbose is verbose indeed, dropping details about each BLE adv it sees
  # level: VERY_VERBOSE

mqtt:
  broker: '192.168.178.127'
  username: !secret mqtt_username
  password: !secret mqtt_password

ota:
  platform: esphome
  password: !secret ota_password
