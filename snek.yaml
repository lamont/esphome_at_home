esphome:
  name: snek
  # GPIO15 needs to be on for the grove bus to get power
  # NEEDS PHYSICAL INSPECTION (2026-08-01): all Grove-bus sensors (3x DHT +
  # SHT3x over I2C) are dead - I2C scan finds no devices, DHTs report
  # "Communication failed". Confirmed this isn't a config issue: reverted
  # from output/INPUT_PULLUP back to this switch/gpio pattern (matching
  # every other wio_link device in the fleet) and re-flashed; sensors still
  # dead on the next boot with an identical failure signature. Likely a
  # failed Grove power-gate transistor or a corroded/disconnected Grove hub
  # connector - check for corrosion, this device lives in a snake enclosure.
  on_boot:
    priority: 99
    then:
      - switch.turn_on: 'grove_power_supply'

esp8266:
  board: wio_link

<<: !include .home.yaml

# Example configuration entry
sensor:
  - platform: dht
    # Digital Port 2
    pin: GPIO13
    temperature:
      name: "Snek midpoint internal ground temperature"
    humidity:
      name: "Snek midpoint internal ground humidity"
    update_interval: 15s
  - platform: dht
    pin: GPIO12
    temperature:
      name: "Snek right internal ground temperature"
    humidity:
      name: "Snek right internal ground humidity"
    update_interval: 15s
  - platform: dht
    model: DHT22
    pin: GPIO14
    temperature:
      name: "Snek external temperature"
    humidity:
      name: "Snek external humidity"
    update_interval: 15s
  - platform: uptime
    name: Uptime Sensor
  - platform: sht3xd
    temperature:
      name: "Snek internal midpoint temperature"
    humidity:
      name: "Snek internal midpoint humidity"
    address: 0x44
    update_interval: 15s

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: True
  id: bus_a

switch:
  - platform: gpio
    pin: GPIO15
    id: 'grove_power_supply'


