# sadbat — Qwiic LED Stick (APA102C) bargraph/dimmer controller
#
# SparkFun Thing Plus ESP32 WROOM + SparkFun Qwiic LED Stick - APA102C, wired via the board's
# Qwiic connector. See sadbat-design.md for the full design rationale (fill algorithm, wiring
# gotchas, protocol details, sourcing).
#
# First flash MUST be over USB serial — the device is not running ESPHome yet, so there is no
# OTA to take over. After that, OTA works normally.
# Build:  cd ~/src/esphomeyaml && . aliases && compile sadbat.yaml
# Flash:  esp_flash sadbat

substitutions:
  devicename: sadbat
  friendly_name: Sadbat LED Bar

esphome:
  name: ${devicename}
  comment: "Qwiic LED Stick bargraph/dimmer, no Home Assistant"

esp32:
  board: esp32thing_plus
  framework:
    type: arduino

i2c:
  sda: GPIO23
  scl: GPIO22
  id: qwiic_bus

external_components:
  - source:
      type: local
      path: components

light:
  - platform: sadbat_led
    id: sadbat_light
    name: "${friendly_name}"
    i2c_id: qwiic_bus
    address: 0x23
    restore_mode: ALWAYS_OFF
    # A bargraph display should snap, not fade. ESPHome's default 1s transition would otherwise
    # call write_state() many times per single change (worse yet, repeatedly restarted if the
    # web UI slider is dragged) -- confirmed on hardware that this floods the LED stick's I2C
    # slave with more updates than pacing alone could keep up with.
    default_transition_length: 0s

logger:

# ===== Network =====
# Tries home wifi first, then work wifi (built/tested at home, deployed at work); falls back to
# its own AP + captive portal only if neither known network is in range.
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret work_wifi_ssid
      password: !secret work_wifi_password
  ap:
    ssid: "sadbat-fallback"
    password: !secret sadbat_ap_password

captive_portal:

web_server:
  port: 80
  local: true

ota:
  platform: esphome
  password: !secret ota_password
