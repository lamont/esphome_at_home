esphome:
  name: powermeter
  # GPIO15 needs to be on for the grove bus to get power
  on_boot:
    priority: -10
    then:
      - switch.turn_on: 'grove_power_supply'

esp8266:
  board: wio_link

# Example configuration entry
sensor:
  - platform: dht
    model: DHT11
    pin:
      number: GPIO13
      # shared with the pulse_counter below in the original wiring; unclear
      # if intentional but preserving prior (pre-2026) behavior rather than
      # guessing a different physical pin. Needs owner verification.
      allow_other_uses: true
    temperature:
      name: "Garage Temperature"
    humidity:
      name: "Garage Humidity"
    update_interval: 15s
  - platform: uptime
    name: powermeter Uptime Sensor
    # I think this is the middle pin
  - platform: dht
    model: DHT22
    pin: GPIO12
    temperature:
      name: "Weed Temperature"
    humidity:
      name: "Weed Humidity"
  - platform: pulse_counter
    pin:
      number: GPIO13
      allow_other_uses: true
    unit_of_measurement: 'watts'
    name: 'Power Meter'
    filters:
      - multiply: 0.06

switch:
  - platform: gpio
    pin: GPIO15
    id: 'grove_power_supply'


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

mqtt:
  broker: '192.168.178.127'
  username: !secret mqtt_username
  password: !secret mqtt_password

# Enable logging
logger:

ota:
  platform: esphome
