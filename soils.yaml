esphome:
  name: soils

esp32:
  board: pocket_32
  framework:
    type: arduino

ota:
  platform: esphome

# some sensors
sensor:
  - platform: adc
    name: Battery Voltage
    pin:
      number: GPIO35
      allow_other_uses: true
    attenuation: 12db
    filters:
      - multiply: 2
    update_interval: 10s
    expire_after: 300s
    accuracy_decimals: 5
  - platform: adc
    name: Battery Percent
    unit_of_measurement: '%'
    pin:
      number: GPIO35
      allow_other_uses: true
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 2
      - calibrate_linear:
          - 2.7 -> 0
          - 4.64952 -> 100
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 10s
  - platform: uptime
    name: last_update
    update_interval: '10s'
    filters:
      - lambda: return (id(sntp_time).now()).timestamp;

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

mqtt:
  broker: '192.168.178.127'
  username: !secret mqtt_username
  password: !secret mqtt_password

# Enable logging
logger:

time:
  - platform: sntp
    id: sntp_time 
    servers:
      - 192.168.178.1

