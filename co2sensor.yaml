# SCD41 CO2 sensor + SSD1306 OLED display
# and a testbed for stuff like the AMG8833 8x8 IR thermal sensor


esphome:
  name: co2sensor
  includes:
    - includes/AMG8833-ESPHOME/amg8833.h
    - includes/AMG8833-ESPHOME/amg8833_camera.h
    #- includes/AMG8833-ESPHOME/amg8833_person_detected.h
  libraries:
    - "Wire"
    - "SparkFun GridEYE AMG88 Library"
# needed https://github.com/espressif/arduino-esp32/pull/6881 from 27 days ago before this board is defined
esp32:
  board: um_feathers3
  variant: esp32s3
  framework:
    type: arduino
    version: 2.0.2
    platform_version: 5.0.0

# Example configuration entry
i2c:
  sda: GPIO8
  scl: GPIO9

