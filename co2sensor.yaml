# SCD41 CO2 sensor + SSD1306 OLED display
# and a testbed for stuff like the AMG8833 8x8 IR thermal sensor


esphome:
  name: co2sensor

esp32:
  board: um_feathers3
  variant: esp32s3
  framework:
    type: arduino
    version: recommended

external_components:
  - source:
      type: local
      path: components

# Example configuration entry
i2c:
  sda: GPIO8
  scl: GPIO9

amg8833:
  update_interval: 1s

