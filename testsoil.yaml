esphome:
  name: testsoil
  # GPIO15 needs to be on for the grove bus to get power
  on_boot:
    priority: 99
    then:
      - switch.turn_on: 'grove_power_supply'

esp8266:
  board: wio_link

# Example configuration entry
sensor:
  - platform: uptime
    name: Uptime Sensor
  - platform: adc
    name: moisture
    pin: A0
    update_interval: '10s'
  - platform: template
    name: last_update
    id: template_sens
    update_interval: '10s'
    unit_of_measurement: 's'
    filters:
      - lambda: return (id(sntp_time).now()).timestamp;
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 10s

switch:
  - platform: gpio
    pin: GPIO15
    id: 'grove_power_supply'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

api:

deep_sleep:
  run_duration: 1min
  sleep_duration: 700seconds

# Enable logging
logger:

ota:
  platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: 'America/Los_Angeles'
    servers:
      - 192.168.178.1
